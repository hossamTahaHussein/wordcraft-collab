[package]
name = "wordcraft-proof"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "WordCraft proofing per language: spelling, suggestions, grammar checks and hyphenation for English (public-domain word list), Arabic (bundled Ayaspell dictionary) and Polish (installed Hunspell dictionary, TeX patterns)"

